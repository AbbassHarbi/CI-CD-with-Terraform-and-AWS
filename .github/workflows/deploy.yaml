name: CI/CD with terraform

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ALERTS_EMAIL: ${{ secrets.ALERTS_EMAIL }}

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs: 
      instance_id: ${{ steps.get_instance_id.outputs.Instance_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Format Terraform Check
        run: terraform fmt -check -recursive -diff
        working-directory: ./Terraform
      - name: Init
        id: init
        run: terraform init -backend-config="bucket=$AWS_TF_STATE_BUCKET_NAME" -backend-config="region=$AWS_REGION" 
        working-directory: ./Terraform
      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ./Terraform
      - name: Terraform TFLint Setup
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true
      - name: Initialize TFLint
        run: tflint --init
        working-directory: ./Terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run TFLint
        run: tflint --format compact
        working-directory: ./Terraform
      - name: IaC Security Scan
        id: IaC_checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Terraform
          quiet: false
          soft_fail: true
          output_format: cli
          framework: terraform
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="region=$AWS_REGION" \
            -var="alerts_email=$ALERTS_EMAIL" \
            -out=PLAN
        working-directory: ./Terraform
      - name: terraform apply
        id: apply
        run: terraform apply PLAN
        working-directory: ./Terraform
      - name: Get Instance ID
        id: get_instance_id
        run: |
          echo "Instance_ID=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
        working-directory: ./Terraform
  deploy-app:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login TO ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: node.app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        working-directory: ./aws-terraform-github-actions-cicd
      - name: Deploy to EC2 through SSM
        id: ssm_deploy
        env:
          EC2_INSTANCE_ID: ${{ needs.deploy-infra.outputs.instance_id }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: node.app
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-1
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EC2_INSTANCE_ID" ]]; then
            echo "EC2 instance ID output is empty"
            exit 1
          fi

          SCRIPT="$(sed \
            -e "s|@REGISTRY@|${REGISTRY}|g" \
            -e "s|@REPOSITORY@|${REPOSITORY}|g" \
            -e "s|@IMAGE_TAG@|${IMAGE_TAG}|g" \
            -e "s|@REGION@|${AWS_REGION}|g" \
            scripts/deploy-ec2.sh)"

          # Encode the multi-line script safely as JSON for the SSM parameter.
          PARAMS_JSON="$(jq -n --arg cmd "$SCRIPT" '{commands:[$cmd]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${REPOSITORY}:${IMAGE_TAG}" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")"

          echo "SSM deployment command submitted: ${COMMAND_ID}"

          if ! aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}"; then
            echo "SSM deployment did not complete successfully"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json \
            --region "${AWS_REGION}"